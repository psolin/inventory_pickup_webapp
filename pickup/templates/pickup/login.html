{% extends "pickup/base.html" %}

{% block title %}Login - Inventory Pickup{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-box-seam" style="font-size: 3rem; color: var(--ip-accent);"></i>
        <h3 class="fw-bold mt-2">Inventory Pickup</h3>
        <p class="text-muted">Sign in to your account</p>
      </div>
      <div class="card">
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </form>
          <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="text-muted text-decoration-none small">Forgot your password?</a>
          </div>
          <hr>
          <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{% url 'signup' %}" class="small fw-semibold text-decoration-none" style="color: var(--ip-accent);">Sign up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
