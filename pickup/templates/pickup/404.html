{% extends "pickup/base.html" %}
{% load i18n %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
      <div class="card">
        <div class="card-body py-5">
          <i class="bi bi-exclamation-circle text-muted" style="font-size: 4rem;"></i>
          <h1 class="fw-bold mt-3">404</h1>
          <p class="text-muted mb-4">The page you're looking for doesn't exist.</p>
          <a href="/" class="btn btn-primary">
            <i class="bi bi-house-door me-1"></i>Go Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
